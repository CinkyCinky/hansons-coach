<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Si offline — Hansons Coach</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0a0a0f; color: #e5e7eb; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card { max-width: 360px; text-align: center; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.55; margin: 0 0 24px; }
    button {
      background: #3b82f6; color: #fff; border: 0; border-radius: 12px;
      padding: 12px 24px; font-weight: 700; font-size: 14px; cursor: pointer;
      box-shadow: 0 0 20px rgba(59,130,246,0.3);
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Si offline</h1>
    <p>Hansons Coach potrebuje pripojenie na internet, aby načítal tvoje dáta z Garminu a AI trénera. Pripoj sa a skús to znova.</p>
    <button onclick="location.reload()">Skúsiť znova</button>
  </div>
</body>
</html>
